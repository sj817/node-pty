name: Publish packages
run-name: publish-${{ inputs.run_id }}${{ inputs.dry_run && '-preview' || '' }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch build run
        required: true
        type: string
      dry_run:
        description: Validate without publishing
        type: boolean
        default: true
      android_proof:
        description: Optional Android proof when the build bundle is awaiting device verification
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      upstream_tag: ${{ steps.source.outputs.upstream_tag }}
      revision: ${{ steps.source.outputs.revision }}
      test_version: ${{ steps.source.outputs.test_version }}
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - run: npm ci --ignore-scripts
      - id: source
        run: node scripts/prepare-publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          ANDROID_PROOF: ${{ inputs.android_proof }}
  validate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-22.04
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      DOWNSTREAM_REVISION: ${{ needs.prepare.outputs.revision }}
      TEST_VERSION: ${{ needs.prepare.outputs.test_version }}
      ANDROID_PROOF: ${{ inputs.android_proof }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: dist/bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: npm run publish:dry
        env:
          GH_TOKEN: ${{ github.token }}
  seal:
    if: ${{ !inputs.dry_run }}
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      DOWNSTREAM_REVISION: ${{ needs.prepare.outputs.revision }}
      TEST_VERSION: ${{ needs.prepare.outputs.test_version }}
      ANDROID_PROOF: ${{ inputs.android_proof }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: dist/bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/seal.ts
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: [prepare, seal]
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      DOWNSTREAM_REVISION: ${{ needs.prepare.outputs.revision }}
      TEST_VERSION: ${{ needs.prepare.outputs.test_version }}
      ANDROID_PROOF: ${{ inputs.android_proof }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-bundle
          path: dist/bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
      DOWNSTREAM_REVISION: ${{ needs.prepare.outputs.revision }}
      TEST_VERSION: ${{ needs.prepare.outputs.test_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - run: node scripts/seal.ts --finalize
        env:
          GH_TOKEN: ${{ github.token }}
  notify:
    needs: [prepare, validate, seal, publish, finalize]
    if: always() && !inputs.dry_run
    continue-on-error: true
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - run: gh workflow run detect.yml --repo "$REPO" --ref main -f apply=true -f completed_run_id="$RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
