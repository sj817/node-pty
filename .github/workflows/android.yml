name: Verify Android Bionic tarballs
on:
  workflow_call:
    inputs:
      run_id:
        type: string
        default: ""
      release:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing successful build run, or supply a release tag
        type: string
      release:
        description: Optional published release tag to retest
        type: string
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    env:
      TARGET_PLATFORM: android-arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.1"
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        if: inputs.release == ''
        with:
          name: javascript
          path: dist/main
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.2
        if: inputs.release == ''
        with:
          name: native-android-arm64
          path: dist/android-arm64
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/retest.ts
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
      - run: node scripts/android-container.ts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-proof
          path: dist/android-arm64/verified.json
          if-no-files-found: error
