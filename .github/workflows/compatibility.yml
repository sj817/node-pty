name: Retest published binaries
run-name: ${{ inputs.key }}
on:
  workflow_dispatch:
    inputs:
      key:
        description: Runtime fingerprint
        type: string
        required: true
      runtimes:
        description: JSON object with exact node and electron version arrays
        type: string
        required: true
      release:
        description: Existing release tag to retest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: compatibility-${{ inputs.key }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:require('./release.json').platforms})+'\n')"
  test:
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: node scripts/retest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm run verify
        env:
          RUNTIME_MATRIX: ${{ inputs.runtimes }}
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.id }}
          path: dist/${{ matrix.id }}/verified.json
